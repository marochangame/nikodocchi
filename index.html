
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>にこにこどっちかな😊</title>
<style>
body {
    font-family: sans-serif;
    text-align: center;
    background: #ffffff;
}
#question {
    font-size: 32px;
    margin: 20px;
}
.choice {
    font-size: 28px;
    padding: 40px;
    margin: 10px;
    border-radius: 20px;
}
.top { background: #FFB347; }
.bottom { background: #87CEFA; }
#result {
    font-size: 28px;
    margin: 20px;
}
</style>
</head>
<body>

<div id="question"></div>
<div id="top" class="choice top"></div>
<div id="bottom" class="choice bottom"></div>
<div id="result"></div>

<script>
let questions = [["朝ごはんはどっち？", "🍞 トースト", "🍜 ラーメン"], ["歯みがきで使うのはどっち？", "🪥 歯ブラシ", "🍴 フォーク"], ["お風呂で使うのはどっち？", "🧼 石けん", "🍌 バナナ"], ["寝る前にするのはどっち？", "😴 ねる", "🏃 走る"], ["外に出るとき履くのはどっち？", "👟 くつ", "🍉 スイカ"], ["雨の日に使うのはどっち？", "☂️ 傘", "🕶 サングラス"], ["ごはんで使うのはどっち？", "🥢 はし", "🖊 ペン"], ["手を洗うとき使うのはどっち？", "🧼 石けん", "📱 スマホ"], ["ねる場所はどっち？", "🛏 ベッド", "🚗 車"], ["テレビで使うのはどっち？", "📺 リモコン", "🥄 スプーン"], ["春の花はどっち？", "🌸 さくら", "🎄 ツリー"], ["夏に食べたいのはどっち？", "🍧 かき氷", "🍲 おでん"], ["秋の食べ物はどっち？", "🍠 さつまいも", "🍉 スイカ"], ["冬に着るのはどっち？", "🧥 コート", "👕 Tシャツ"], ["暑い日に使うのはどっち？", "🧊 氷", "🔥 火"], ["お風呂で食べるのはどっち？", "🍌 バナナ", "🧼 石けん"], ["頭にかぶるのはどっち？", "👒 帽子", "🍜 ラーメン"], ["足にはくのはどっち？", "🧦 くつした", "🍰 ケーキ"], ["電話で話すのはどっち？", "📞 電話", "🍙 おにぎり"], ["飲みものはどっち？", "🥤 ジュース", "🪨 石"], ["好きなのはどっち？", "🍣 おすし", "🍔 ハンバーガー"], ["行きたいのはどっち？", "🌊 海", "⛰ 山"], ["楽しいのはどっち？", "👶 孫と遊ぶ", "💤 ずっと寝る"], ["食べたいのはどっち？", "🍓 いちご", "🌶 とうがらし"], ["行くならどっち？", "♨️ 温泉", "🏢 会社"], ["多いのはどっち？", "🍎 5こ", "🍎 2こ"], ["大きいのはどっち？", "🐘 ぞう", "🐜 あり"], ["早いのはどっち？", "🚗 車", "🐢 カメ"], ["長いのはどっち？", "🚄 新幹線", "✏️ えんぴつ"], ["重いのはどっち？", "🪨 石", "🍃 はっぱ"]];
let current = 0;

function shuffle(q) {
    if (Math.random() > 0.5) {
        return [q[0], q[1], q[2], true];
    } else {
        return [q[0], q[2], q[1], false];
    }
}

function showQuestion() {
    if (current >= questions.length) {
        document.getElementById("question").innerText = "おわり😊";
        return;
    }

    let q = shuffle(questions[current]);
    document.getElementById("question").innerText = q[0];

    document.getElementById("top").innerText = q[1];
    document.getElementById("bottom").innerText = q[2];

    document.getElementById("top").onclick = function() {
        checkAnswer(q[3]);
    };
    document.getElementById("bottom").onclick = function() {
        checkAnswer(!q[3]);
    };
}

function checkAnswer(correct) {
    if (correct) {
        document.getElementById("result").innerText = "いいね〜😊";
    } else {
        document.getElementById("result").innerText = "おしい〜😊";
    }

    setTimeout(() => {
        document.getElementById("result").innerText = "";
        current++;
        showQuestion();
    }, 1000);
}

showQuestion();
</script>

</body>
</html>
