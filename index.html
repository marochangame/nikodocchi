<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="どっちかな" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>どっちかなぁ？</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="app">
    <section id="startScreen" class="screen start-screen">
      <div class="hero">🌸</div>
      <h1>どっちかなぁ？</h1>
      <p class="lead">ゆっくり、楽しく、10問だけ。</p>
      <button id="startBtn" class="start-btn">はじめる</button>
      <button id="soundBtn" class="sound-btn" aria-pressed="true">🔊 音あり</button>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <header class="topbar">
        <div id="progressText" class="progress-text">1 / 10</div>
        <button id="skipBtn" class="skip-btn">⏭️ 次へ</button>
      </header>

      <div class="question-card">
        <div id="questionIcon" class="question-icon">👵</div>
        <h2 id="questionText">どっちかなぁ？</h2>
        <p id="hintText" class="hint-text">あてはまる方を押してね</p>
      </div>

      <div class="choices">
        <button id="choiceA" class="choice choice-a">
          <span id="choiceAEmoji" class="choice-emoji">🍙</span>
          <span id="choiceAText" class="choice-text">おにぎり</span>
        </button>
        <button id="choiceB" class="choice choice-b">
          <span id="choiceBEmoji" class="choice-emoji">🍫</span>
          <span id="choiceBText" class="choice-text">チョコ</span>
        </button>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen hidden">
      <div id="resultEmoji" class="result-emoji">✨</div>
      <h2 id="resultText">いいね〜！</h2>
      <p id="resultSubText">その調子、その調子。</p>
    </section>

    <section id="finishScreen" class="screen finish-screen hidden">
      <div class="hero">🎉</div>
      <h1>おしまい</h1>
      <p id="scoreText" class="lead">10問できました。</p>
      <p class="finish-msg">楽しかったね〜。</p>
      <button id="againBtn" class="start-btn">もう一回</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
