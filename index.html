
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>にこにこどっちかな</title>
<style>
body { font-family:sans-serif; text-align:center; background:#fff8df; }
.question { font-size:32px; margin:20px; }
.choice { font-size:40px; padding:40px; margin:10px; border-radius:20px; }
.top { background:#ffb347; }
.bottom { background:#87cefa; }
</style>
</head>
<body>

<div class="question" id="question"></div>
<div id="top" class="choice top"></div>
<div id="bottom" class="choice bottom"></div>

<script>
let normal = [["朝ごはんはどっち？", "🍞\nトースト", "🍜\nラーメン"], ["お風呂で使うのはどっち？", "🧼\n石けん", "🍌\nバナナ"], ["春の花はどっち？", "🌸\nさくら", "🎄\nツリー"], ["多いのはどっち？", "🍎🍎🍎🍎🍎\n5こ", "🍎🍎\n2こ"], ["大きいのはどっち？", "🐘\nぞう", "🐜\nあり"], ["速いのはどっち？", "🚗\n車", "🐢\nカメ"], ["甘いのはどっち？", "🍰\nケーキ", "🧂\n塩"], ["雨の日に使うのはどっち？", "☂️\n傘", "🕶\nサングラス"], ["歯みがきで使うのはどっち？", "🪥\n歯ブラシ", "🍴\nフォーク"], ["空を飛ぶのはどっち？", "🐦\n鳥", "🐢\nカメ"]];
let both = [["好きなのどっち？", "🍣\nおすし", "🍜\nラーメン"], ["食べたいのどっち？", "🍓\nいちご", "🍰\nケーキ"], ["飲みたいのどっち？", "🍵\nお茶", "☕\nコーヒー"], ["行きたいのどっち？", "🌊\n海", "⛰\n山"]];

function buildDeck() {
  let deck = [];
  let bothCopy = [...both];
  let normalCopy = [...normal];

  while(deck.length < 10) {
    if(Math.random() < 0.2 && bothCopy.length > 0) {
      deck.push({...bothCopy.pop(), both:true});
    } else if(normalCopy.length > 0) {
      deck.push({...normalCopy.pop(), both:false});
    }
  }

  return deck.sort(() => Math.random() - 0.5);
}

let deck = buildDeck();
let index = 0;
let correctTop = true;

function show() {
  if(index >= deck.length) {
    document.getElementById("question").innerText = "おしまい😊";
    return;
  }

  let q = deck[index];
  document.getElementById("question").innerText = q[0];

  correctTop = Math.random() < 0.5;

  document.getElementById("top").innerText = correctTop ? q[1] : q[2];
  document.getElementById("bottom").innerText = correctTop ? q[2] : q[1];

  document.getElementById("top").onclick = () => answer(q, correctTop);
  document.getElementById("bottom").onclick = () => answer(q, !correctTop);
}

function answer(q, correct) {
  if(q.both) {
    alert("どっちもいいね〜😊");
  } else {
    alert(correct ? "いいね〜😊" : "おしい〜😊");
  }
  index++;
  show();
}

show();
</script>

</body>
</html>
